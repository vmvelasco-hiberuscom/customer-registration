<div class="list-page">

  <!-- Page header -->
  <div class="page-header">
    <div class="page-header__left">
      <h1 class="page-header__title">Productos</h1>
      <p class="page-header__subtitle">Catálogo de productos disponibles en el sistema.</p>
    </div>
  </div>

  <!-- Toolbar (search) -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.656a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
      </svg>
      <input
        class="search-input"
        type="search"
        placeholder="Buscar producto..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearch()"
        aria-label="Buscar producto">
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="state-center">
    <div class="spinner" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="!loading && error" class="list-alert list-alert--error">{{ error }}</div>

  <!-- Table card -->
  <div *ngIf="!loading && !error" class="table-card">
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of filteredProducts">
            <td class="cell--id">{{ product.id }}</td>
            <td class="cell--name">{{ product.nombre }}</td>
            <td class="cell--desc">{{ product.descripcion }}</td>
            <td class="cell--price">{{ product.precio | currency:'EUR':'symbol':'1.2-2' }}</td>
          </tr>
          <tr *ngIf="filteredProducts.length === 0">
            <td colspan="4" class="cell--empty">No se encontraron productos.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

name: customer-registration-ci

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/customer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        run: mvn clean package -DskipTests
      - name: Test backend
        run: mvn test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/customer-registration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/customer-registration/package-lock.json
      - name: Skip if frontend package is not present
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json found. Skipping frontend job."
            exit 0
          fi
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build --if-present
      - name: Test frontend
        run: npm test --if-present
